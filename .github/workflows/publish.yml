name: publish

# GitHub Release の発行を起点に npm へ publish する。
# 認証は npm の Trusted Publishing(OIDC)。トークンや OTP は使わない。
# 事前に npmjs.com のパッケージ設定で、この repo と workflow(publish.yml)を
# trusted publisher として登録しておくこと。

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # release environment(GitHub 側設定): v* タグからの run のみデプロイ可、かつ
    # required reviewer の手動承認を通らないと job が開始しない。npm の trusted
    # publisher にも同じ environment 名を登録し、これを通らない OIDC トークンでは
    # publish できないようにする。
    environment: release
    permissions:
      contents: read
      # Trusted Publishing に必須: OIDC トークンの発行権限
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - name: Verify release tag matches package.json version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "release tag ${GITHUB_REF_NAME} does not match package.json version ${version}" >&2
            exit 1
          fi
      # Trusted Publishing は npm CLI 11.5.1 以降が必要。mise が Node を固定するので同梱 npm の
      # バージョンも決まる(グローバル install はしない: npm@latest は Node 固定版と engine
      # 非互換になりうる)。要件を満たさない Node へ更新された場合は publish 前に落とす。
      - name: Verify npm supports trusted publishing
        run: |
          version="$(npm --version)"
          echo "npm ${version}"
          if [ "$(printf '%s\n11.5.1\n' "${version}" | sort -V | head -1)" != "11.5.1" ]; then
            echo "npm >= 11.5.1 is required for trusted publishing, got ${version}" >&2
            exit 1
          fi
      - run: npm publish
